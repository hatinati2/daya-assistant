name: Go CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Format and export Go files
        run: |
          files="$(gofmt -l ./cmd ./internal)"
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            gofmt -w "$file"
            echo "BEGIN_GO_FILE:$file"
            base64 -w0 "$file" | fold -w 40000
            echo "END_GO_FILE:$file"
          done <<< "$files"
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/server
